[versions]
agp         = "8.5.0"
kotlin      = "2.0.0"
coreKtx     = "1.13.1"
appcompat   = "1.7.0"
leanback    = "1.0.0"
lifecycle   = "2.8.3"
fragment    = "1.8.1"
junit       = "4.13.2"

[libraries]
androidx-core-ktx          = { group = "androidx.core",          name = "core-ktx",              version.ref = "coreKtx"   }
androidx-appcompat         = { group = "androidx.appcompat",     name = "appcompat",             version.ref = "appcompat" }
androidx-leanback          = { group = "androidx.leanback",      name = "leanback",              version.ref = "leanback"  }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata  = { group = "androidx.lifecycle",   name = "lifecycle-livedata-ktx",  version.ref = "lifecycle" }
androidx-fragment-ktx      = { group = "androidx.fragment",      name = "fragment-ktx",          version.ref = "fragment"  }
junit                      = { group = "junit",                   name = "junit",                 version.ref = "junit"     }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp"    }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
