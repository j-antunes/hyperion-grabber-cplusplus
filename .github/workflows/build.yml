name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # C++ builds: CI verification only (no release assets — GUI app replaces CLI)
  build-windows-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target hyperion_grabber_windows

  build-linux-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y libx11-dev
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run tests
        run: cd build && ctest --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-grabber-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Package Windows app
        working-directory: desktop
        run: gradle packageMsi --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-grabber-desktop-windows
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/msi/*.msi

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Package Linux app
        working-directory: desktop
        run: gradle packageDeb --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-grabber-desktop-linux
          path: desktop/build/compose/binaries/main/deb/*.deb

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/deb/*.deb
